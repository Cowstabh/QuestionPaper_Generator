<div class="auth-card">
  <h2>Create Platform Profile</h2>
  
  <div *ngIf="errorMessage" class="alert-error">{{ errorMessage }}</div>
  <div *ngIf="successMessage" class="alert-success">{{ successMessage }}</div>

  <form (ngSubmit)="onRegisterSubmit()">
    <div class="form-group">
      <label for="email">Email Address</label>
      <input type="email" id="email" [(ngModel)]="email" name="email" placeholder="name@domain.com" required>
    </div>
    <div class="form-group">
      <label for="mobileNumber">Mobile Number</label>
      <input type="tel" id="mobileNumber" [(ngModel)]="mobileNumber" name="mobileNumber" placeholder="+919876543210" required>
    </div>
    <div class="form-group">
      <label for="password">Password</label>
      <input type="password" id="password" [(ngModel)]="password" name="password" placeholder="Choose a secure password" required>
    </div>
    <button type="submit" class="btn-primary">Register Now</button>
  </form>
  <p class="switch-link">Already have an account? <a routerLink="/login">Login here</a></p>
</div>
