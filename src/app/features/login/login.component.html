<div class="login-container">
  <div class="card">
    <h2>Login to Your Account</h2>

    <!-- Error message for wrong password / server errors -->
    <div *ngIf="errorMessage" class="alert-error">{{ errorMessage }}</div>

    <!-- Info message for unregistered users before redirecting -->
    <div *ngIf="infoMessage" class="alert-info">{{ infoMessage }}</div>

    <form (ngSubmit)="onLogin()">
      <div class="form-group">
        <label for="email">Email Address</label>
        <input type="email" id="email" [(ngModel)]="credentials.email" name="email" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" [(ngModel)]="credentials.password" name="password" required />
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading">
        {{ isLoading ? 'Logging in...' : 'Login' }}
      </button>
    </form>

    <p class="footer-text">
      Don't have an account? <a routerLink="/register">Register here</a>
    </p>
  </div>
</div>
